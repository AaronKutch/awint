[package]
name = "awint_internals"
version = "0.19.0"
edition = "2024"
# `flake.nix` and `ci.yml` read this automatically, but run `nix flake update`
# and fix any hashes. The pinned toolchain in `pinned-toolchain.toml` is
# bumped separately.
rust-version = "1.88"
authors = ["Aaron Kutch <aaronkutch@att.net>"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/AaronKutch/awint"
description = "Internal utilities for the `awint` system of crates"

[features]
const_support = []
# Only zero or one of these should be active
u8_digits = []
u16_digits = []
u32_digits = []
u64_digits = []
u128_digits = []

[dependencies]
const_fn = { workspace = true }
